<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji 記憶翻牌遊戲</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #555;
        }
        .memory-game {
            width: 400px;
            height: 400px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            perspective: 1000px;
        }
        .memory-card {
            width: calc(25% - 10px);
            height: calc(25% - 10px);
            position: relative;
            transform: scale(1);
            transform-style: preserve-3d;
            transition: transform 0.5s;
            cursor: pointer;
        }
        .memory-card:active {
            transform: scale(0.97);
            transition: transform 0.2s;
        }
        .memory-card.flip {
            transform: rotateY(180deg);
        }
        .front-face, .back-face {
            width: 100%;
            height: 100%;
            padding: 10px;
            position: absolute;
            border-radius: 10px;
            background: #fff;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            user-select: none;
        }
        .front-face {
            transform: rotateY(180deg);
            background: #ffeb3b;
        }
        .back-face {
            background: #2196f3;
            color: white;
            font-size: 2rem;
        }
        .btn-restart {
            margin-top: 30px;
            padding: 10px 20px;
            font-size: 1.1rem;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.3s;
        }
        .btn-restart:hover {
            background-color: #45a049;
        }
        @media (max-width: 450px) {
            .memory-game {
                width: 100%;
                height: 90vw;
            }
            .front-face { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <h1>🧠 記憶翻牌遊戲</h1>
    <div class="stats">
        <span>步數: <span id="moves">0</span></span>
        <span>時間: <span id="time">0</span> 秒</span>
    </div>

    <div class="memory-game" id="game-board">
        <!-- 卡片會由 JS 動態生成 -->
    </div>

    <button class="btn-restart" onclick="initGame()">重新開始</button>

    <script>
        const cardsArray = [
            { name: 'dog', icon: '🐶' }, { name: 'cat', icon: '🐱' },
            { name: 'mouse', icon: '🐭' }, { name: 'hamster', icon: '🐹' },
            { name: 'rabbit', icon: '🐰' }, { name: 'fox', icon: '🦊' },
            { name: 'bear', icon: '🐻' }, { name: 'panda', icon: '🐼' }
        ];

        let gameGrid = [];
        let hasFlippedCard = false;
        let lockBoard = false;
        let firstCard, secondCard;
        let moves = 0;
        let matches = 0;
        let timer;
        let seconds = 0;
        let timerStarted = false;

        const board = document.getElementById('game-board');
        const movesElement = document.getElementById('moves');
        const timeElement = document.getElementById('time');

        // 初始化遊戲
        function initGame() {
            board.innerHTML = '';
            gameGrid = [...cardsArray, ...cardsArray];
            gameGrid.sort(() => 0.5 - Math.random()); // 隨機洗牌

            hasFlippedCard = false;
            lockBoard = false;
            firstCard = null;
            secondCard = null;
            moves = 0;
            matches = 0;
            seconds = 0;
            timerStarted = false;
            clearInterval(timer);
            
            movesElement.textContent = moves;
            timeElement.textContent = seconds;

            gameGrid.forEach(item => {
                const card = document.createElement('div');
                card.classList.add('memory-card');
                card.dataset.name = item.name;

                card.innerHTML = `
                    <div class="front-face">${item.icon}</div>
                    <div class="back-face">❓</div>
                `;
                card.addEventListener('click', flipCard);
                board.appendChild(card);
            });
        }

        // 翻牌邏輯
        function flipCard() {
            if (lockBoard) return;
            if (this === firstCard) return;

            if (!timerStarted) {
                startTimer();
                timerStarted = true;
            }

            this.classList.add('flip');

            if (!hasFlippedCard) {
                hasFlippedCard = true;
                firstCard = this;
                return;
            }

            secondCard = this;
            moves++;
            movesElement.textContent = moves;
            checkForMatch();
        }

        // 檢查配對
        function checkForMatch() {
            let isMatch = firstCard.dataset.name === secondCard.dataset.name;

            if (isMatch) {
                disableCards();
                matches++;
                if (matches === cardsArray.length) {
                    clearInterval(timer);
                    setTimeout(() => alert(`🎉 恭喜過關！\n總共花了 ${seconds} 秒，移動了 ${moves} 步！`), 500);
                }
            } else {
                unflipCards();
            }
        }

        // 配對成功，移除點擊事件
        function disableCards() {
            firstCard.removeEventListener('click', flipCard);
            secondCard.removeEventListener('click', flipCard);
            resetBoard();
        }

        // 配對失敗，蓋回卡片
        function unflipCards() {
            lockBoard = true;
            setTimeout(() => {
                firstCard.classList.remove('flip');
                secondCard.classList.remove('flip');
                resetBoard();
            }, 1000);
        }

        // 重置狀態
        function resetBoard() {
            [hasFlippedCard, lockBoard] = [false, false];
            [firstCard, secondCard] = [null, null];
        }

        // 計時器
        function startTimer() {
            timer = setInterval(() => {
                seconds++;
                timeElement.textContent = seconds;
            }, 1000);
        }

        // 啟動遊戲
        initGame();
    </script>
</body>
</html>
